name: Temporary keep latest two Actions artifacts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-keep-latest-two-artifacts.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Keep only the two newest artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retain newest two and delete older artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            artifacts.sort((a, b) =>
              new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
            );

            const keep = artifacts.slice(0, 2);
            const remove = artifacts.slice(2);

            core.info(`Found ${artifacts.length} artifacts in ${owner}/${repo}.`);
            core.info(`Keeping: ${keep.map(a => `${a.name} (ID ${a.id}, ${a.created_at})`).join("; ") || "none"}`);

            for (const artifact of remove) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id
              });
              core.info(`Deleted ${artifact.name} (ID ${artifact.id}).`);
            }

            const remaining = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            if (remaining.length > 2) {
              core.setFailed(`Verification failed: ${remaining.length} artifacts remain.`);
            } else {
              core.info(`Verification passed: ${remaining.length} artifact(s) remain.`);
              for (const artifact of remaining) {
                core.info(`Retained: ${artifact.name} (ID ${artifact.id}).`);
              }
            }
