# v1.20.0 release candidate build: compile, unit tests, signed APK and signature verification
name: Build and Release Noor Al Iman Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, improve/v1.16-reliability, improve/v1.16.1-test-feedback, fix/v1.16.2-reliability, improve/v1.17-complete-overhaul, fix/v1.18-adhan-scheduler-audit, fix/webview-background-recovery, fix/v1.19-main-alarm-reliability, fix/v1.19.1-crash-adhan-stability, fix/comprehensive-v1.20-html-adhan-reliability, noor-al-iman-v1.19.1-stability-patch, fix/v1.21.0-adhan-root-cause]
  pull_request:
    branches: [main, fix/v1.19-main-alarm-reliability]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate web assets
        run: |
          set -euo pipefail
          node --check App/src/main/assets/scripts/app.js
          node --check App/src/main/assets/scripts/tafsir-ui.js
          node --check App/src/main/assets/scripts/compass.js
          node --check App/src/main/assets/enhancements.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          public = Path('index.html').read_bytes()
          app = Path('App/src/main/assets/noor-aliman.html').read_text(encoding='utf-8')
          assert public.lstrip().lower().startswith(b'<!doctype html>'), 'index.html must begin with an HTML doctype'
          assert app.lstrip().lower().startswith('<!doctype html>'), 'app shell must begin with an HTML doctype'
          assert not re.search(r'<script\b(?![^>]*\bsrc=)[^>]*>', app, re.I), 'app shell must not contain inline scripts'
          for asset in ('styles/noor-aliman.css', 'scripts/app.js', 'scripts/tafsir-ui.js', 'scripts/compass.js', 'enhancements.js', 'data/embedded-tafsir.json'):
              assert (Path('App/src/main/assets') / asset).is_file(), f'missing app asset: {asset}'
          assert "script-src 'self'" in app, 'script CSP must be external-only'
          PY
          python3 - <<'PY'
          from pathlib import Path
          dhikr = Path('App/src/main/java/app/nooraliman/DhikrAlarmScheduler.java').read_text()
          prayer = Path('App/src/main/java/app/nooraliman/PrayerAlarmScheduler.java').read_text()
          assert 'setExactAndAllowWhileIdle' not in dhikr and 'setAndAllowWhileIdle' not in dhikr, 'dhikr must not use allow-while-idle alarms'
          assert 'setAlarmClock' in prayer, 'prayer scheduler must use exact alarm-clock events when permitted'
          assert 'setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP' in prayer, 'prayer scheduler must provide an inexact wakeup fallback and daily refresh'
          assert 'EXTRA_EXACT, false' in prayer, 'inexact fallback must be marked for receiver diagnostics'
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing keystore
        env:
          NOOR_ALIMAN_KEYSTORE_BASE64: ${{ secrets.NOOR_ALIMAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NOOR_ALIMAN_KEYSTORE_BASE64"
          printf '%s' "$NOOR_ALIMAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noor-aliman-release.jks"
          test -s "$RUNNER_TEMP/noor-aliman-release.jks"
          chmod 600 "$RUNNER_TEMP/noor-aliman-release.jks"

      - name: Run available unit tests and build signed Release APK
        env:
          NOOR_ALIMAN_KEYSTORE: ${{ runner.temp }}/noor-aliman-release.jks
          NOOR_ALIMAN_STORE_PASSWORD: ${{ secrets.NOOR_ALIMAN_STORE_PASSWORD }}
          NOOR_ALIMAN_KEY_PASSWORD: ${{ secrets.NOOR_ALIMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="App/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-iman-v1.21.0-signed-apk
          path: |
            App/build/outputs/apk/release/app-release.apk
            App/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/noor-aliman-release.jks"

  publish-v1-16-1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish v1.16.1 release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: noor-aliman-v1.16.1-test-candidate-signed-apk
          path: release-assets

      - name: Publish Noor Al-Iman v1.16.1 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.16.1
          name: Noor Al-Iman v1.16.1
          target_commitish: ${{ github.sha }}
          body: |
            الإصدار 1.16.1 من نور الإيمان.

            - صفحة إعدادات مستقلة بأقسام منظمة وإعدادات فرعية قابلة للفتح والإغلاق.
            - حفظ اختيارات المستخدم واستعادتها عند إعادة فتح التطبيق.
            - تذكير قبل الصلاة بعشر دقائق بصوت إشعار Android عادي، دون تشغيل الأذان الكامل.
            - أذان الدوحة افتراضي عند التثبيت الجديد، مع احترام اختيار المستخدم لاحقاً.
            - تحسين وضوح عدّاد التسبيح في الوضع الليلي.
            - تحسين الواجهة مع الحفاظ على الهوية الخضراء والذهبية.
            - تحسينات لدورة حياة WebView والتعامل مع إعادة فتح التطبيق.

            تم بناء APK والتحقق من توقيعه آلياً عبر GitHub Actions. يظل الاختبار على الأجهزة الفعلية ضرورياً للتحقق من جميع السلوكيات.
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish-v1-17-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish v1.17.0 release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: noor-al-iman-v1.18.0-signed-apk
          path: release-assets

      - name: Publish Noor Al-Iman v1.17.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.17.0
          name: Noor Al-Iman v1.17.0
          target_commitish: ${{ github.sha }}
          body: |
            الإصدار 1.17.0 من نور الإيمان.

            - تحسين حساب مواقيت الصلاة ومنع جدولة أوقات غير صالحة.
            - جدولة احتياطية للتنبيهات عند عدم توفر Exact Alarm، وإعادة الجدولة عند عودة التطبيق.
            - تحديث بصري متجاوب لصفحة الإعدادات والبطاقات والوضع الليلي.
            - تحسين الوصول إلى إعدادات التطبيق والتحكم في الأذان.
            - إضافة اختبارات Regression لحساب زاوية العصر وتصنيف وضع الهاتف.
            - لم تتغير ملفات الصوت أو أذونات Android.

            نجح بناء APK الموقّع والتحقق من توقيعه آلياً. تظل تجربة الجهاز الفعلي مطلوبة للتحقق من سلوك الحساسات والإشعارات وشاشة القفل.
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish-v1-18-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish v1.18.0 release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: noor-al-iman-v1.18.0-signed-apk
          path: release-assets

      - name: Publish Noor Al-Iman v1.18.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.18.0
          name: Noor Al-Iman v1.18.0
          target_commitish: ${{ github.sha }}
          body: |
            الإصدار 1.18.0 من نور الإيمان.

            - إصلاح جدولة الأذان والتذكير باستخدام Exact Alarms عند منح صلاحية Android المطلوبة.
            - منع إعادة بناء الجدولة دون تغير الإعدادات، ومعالجة حالات إعادة الجدولة عند العودة للتطبيق.
            - استعادة الجدولة عند تغير الوقت والمنطقة الزمنية وإعادة تشغيل الهاتف ومنح الصلاحية.
            - توحيد حساب التاريخ الهجري مع Umm al-Qura على إصدارات Android المدعومة.
            - إضافة تشخيص محلي يقارن وقت التنبيه المتوقع بوقت وصوله ويسجل أخطاء تشغيل الأذان.
            - إضافة موقع الدبيبة/مروي كخيار مستقل دون تغيير الموقع المحفوظ أو الافتراضي.

            **مهم:** يلزم تفعيل إذن «المنبهات والتذكيرات» وإذن الإشعارات من إعدادات Android. اجتازت النسخة الاختبارات الآلية والبناء والتحقق من التوقيع؛ اختبار الأجهزة الفعلية مستمر بعد النشر، وقد تختلف قيود البطارية بين الشركات والأجهزة.
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish-v1-19-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish v1.19.0 release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: noor-al-iman-v1.19.0-signed-apk
          path: release-assets

      - name: Publish Noor Al-Iman v1.19.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.19.0
          name: Noor Al-Iman v1.19.0
          target_commitish: ${{ github.sha }}
          body: |
            الإصدار 1.19.0 من نور الإيمان.

            - تحسين استقرار التطبيق عند الانتقال إلى الخلفية والعودة، ومعالجة فقدان WebView Renderer واستعادة الحالة.
            - تقليل النسخ المؤقتة للذاكرة أثناء تحميل صفحة التطبيق.
            - تحسين دورة حياة تشغيل ملفات الأذان وإغلاق موارد الصوت بصورة آمنة.
            - تحسين جدولة تنبيهات الصلاة والأذكار والتعامل مع صلاحية Exact Alarm والتنبيهات الاحتياطية.
            - إضافة اختبارات مرجعية لمقارنة حساب مواقيت الصلاة بين Java وJavaScript لطرق حساب متعددة واختيارات العصر.
            - إزالة أربعة ملفات/مجلدات Save/save غير المطلوبة.

            اجتاز البناء والاختبارات الآلية والتحقق من توقيع APK عبر GitHub Actions. لم يُجرَ اختبار شامل على هاتف فعلي؛ لذلك يلزم التحقق من سلوك الخلفية والتنبيهات والأذان على الأجهزة قبل اعتماد الاستقرار ميدانياً.
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish-v1-20-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish v1.20.0 release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed v1.20.0 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: noor-al-iman-v1.20.0-signed-apk
          path: release-assets

      - name: Publish Noor Al-Iman v1.20.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.20.0
          name: Noor Al-Iman v1.20.0
          target_commitish: ${{ github.sha }}
          body: |
            الإصدار 1.20.0 من نور الإيمان.

            - إعادة تنظيم واجهة التطبيق بفصل HTML وCSS وJavaScript إلى وحدات مستقلة.
            - فصل بيانات التفسير المحلية في ملفات JSON مستقلة.
            - تحسين جدولة الصلاة باستخدام AlarmClock وإعادة المحاولة عند تعذر إنشاء المنبه الدقيق.
            - تحسين دورة حياة MediaPlayer ومعالجة فشل التحضير وإتاحة إيقاف الأذان من الإشعار.
            - إزالة حد المعاينة الثابت وتحسين تحميل الأصول المحلية داخل WebView.
            - إصلاح تحميل مكرر لأصول الواجهة وإضافة اختبار لإعادة محاولة الجدولة.

            اجتاز APK البناء والاختبارات الآلية والتحقق من التوقيع عبر GitHub Actions. لم يكتمل اختبار شامل على هاتف فعلي؛ يظل اختبار Doze وإدارة البطارية والأذان الكامل مطلوباً على أجهزة Android المختلفة.
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish-v1-21-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish v1.21.0 release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed v1.21.0 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: noor-al-iman-v1.21.0-signed-apk
          path: release-assets

      - name: Publish Noor Al-Iman v1.21.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.21.0
          name: Noor Al-Iman v1.21.0
          target_commitish: ${{ github.sha }}
          body: |
            الإصدار 1.21.0 من نور الإيمان.

            - إصلاح جذري لعدم عمل الأذان: جدولة كل الصلوات (15 يوماً × 5 صلوات) بدل منبّه واحد فقط.
            - استخدام setExactAndAllowWhileIdle لكل تنبيهات الصلاة، مع إلغاء البديل التقريبي الصامت.
            - تحويل التحديث اليومي إلى RTC_WAKEUP مع setAndAllowWhileIdle حتى يعمل في وضع Doze.
            - إظهار تنبيه إذن «المنبهات والتذكيرات» عند أول تشغيل حتى لو كان مفتاح الأذان مطفأً.
            - تفعيل مفتاح «تشغيل الأذان في أوقاته» افتراضياً على التثبيت الجديد.
            - تسجيل سبب إسقاط التنبيه في صف التشخيص داخل التطبيق.
            - تحديث آلية جدولة الأذان والتذكيرات والتشخيص ضمن التغييرات الموثقة في PR #13.

            تم بناء APK والتوقيع والتحقق آلياً عبر GitHub Actions. يبقى اختبار الأجهزة الفعلية (Doze، إدارة بطارية سامسونج، تشغيل الأذان الكامل) مطلوباً قبل اعتماد الاستقرار ميدانياً.
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
