# v1.17 candidate build: compile, unit tests, signed APK and signature verification
name: Build and Release Noor Al Iman Android APK

on:
  push:
    branches: [main, improve/v1.16-reliability, improve/v1.16.1-test-feedback, fix/v1.16.2-reliability, improve/v1.17-complete-overhaul]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate web assets
        run: |
          set -euo pipefail
          node --check App/src/main/assets/enhancements.js
          python3 -c "from pathlib import Path; p=Path('index.html').read_bytes(); assert p.lstrip().lower().startswith(b'<!doctype html>'), 'index.html must begin with an HTML doctype'"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing keystore
        env:
          NOOR_ALIMAN_KEYSTORE_BASE64: ${{ secrets.NOOR_ALIMAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NOOR_ALIMAN_KEYSTORE_BASE64"
          printf '%s' "$NOOR_ALIMAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noor-aliman-release.jks"
          test -s "$RUNNER_TEMP/noor-aliman-release.jks"
          chmod 600 "$RUNNER_TEMP/noor-aliman-release.jks"

      - name: Run available unit tests and build signed Release APK
        env:
          NOOR_ALIMAN_KEYSTORE: ${{ runner.temp }}/noor-aliman-release.jks
          NOOR_ALIMAN_STORE_PASSWORD: ${{ secrets.NOOR_ALIMAN_STORE_PASSWORD }}
          NOOR_ALIMAN_KEY_PASSWORD: ${{ secrets.NOOR_ALIMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="App/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-al-iman-v1.17-overhaul-candidate-signed-apk
          path: |
            App/build/outputs/apk/release/app-release.apk
            App/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/noor-aliman-release.jks"

  publish-v1-16-1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish v1.16.1 release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: noor-aliman-v1.16.1-test-candidate-signed-apk
          path: release-assets

      - name: Publish Noor Al-Iman v1.16.1 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.16.1
          name: Noor Al-Iman v1.16.1
          target_commitish: ${{ github.sha }}
          body: |
            الإصدار 1.16.1 من نور الإيمان.

            - صفحة إعدادات مستقلة بأقسام منظمة وإعدادات فرعية قابلة للفتح والإغلاق.
            - حفظ اختيارات المستخدم واستعادتها عند إعادة فتح التطبيق.
            - تذكير قبل الصلاة بعشر دقائق بصوت إشعار Android عادي، دون تشغيل الأذان الكامل.
            - أذان الدوحة افتراضي عند التثبيت الجديد، مع احترام اختيار المستخدم لاحقاً.
            - تحسين وضوح عدّاد التسبيح في الوضع الليلي.
            - تحسين الواجهة مع الحفاظ على الهوية الخضراء والذهبية.
            - تحسينات لدورة حياة WebView والتعامل مع إعادة فتح التطبيق.

            تم بناء APK والتحقق من توقيعه آلياً عبر GitHub Actions. يظل الاختبار على الأجهزة الفعلية ضرورياً للتحقق من جميع السلوكيات.
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
