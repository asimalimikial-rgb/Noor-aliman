
name: Build Noor Al Iman Signed Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Restore signing keystore
        env:
          NOOR_ALIMAN_KEYSTORE_BASE64: ${{ secrets.NOOR_ALIMAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NOOR_ALIMAN_KEYSTORE_BASE64"
          printf '%s' "$NOOR_ALIMAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noor-aliman-release.jks"
          test -s "$RUNNER_TEMP/noor-aliman-release.jks"
          chmod 600 "$RUNNER_TEMP/noor-aliman-release.jks"

      - name: Build signed Release APK
        env:
          NOOR_ALIMAN_KEYSTORE: ${{ runner.temp }}/noor-aliman-release.jks
          NOOR_ALIMAN_STORE_PASSWORD: ${{ secrets.NOOR_ALIMAN_STORE_PASSWORD }}
          NOOR_ALIMAN_KEY_PASSWORD: ${{ secrets.NOOR_ALIMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-aliman-release-apk
          path: App/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/noor-aliman-release.jks"
