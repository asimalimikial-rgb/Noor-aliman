name: Build Noor Al Iman 1.16.1 test candidate APK

on:
  push:
    branches: [main, improve/v1.16-reliability, improve/v1.16.1-test-feedback]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing keystore
        env:
          NOOR_ALIMAN_KEYSTORE_BASE64: ${{ secrets.NOOR_ALIMAN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$NOOR_ALIMAN_KEYSTORE_BASE64"
          printf '%s' "$NOOR_ALIMAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/noor-aliman-release.jks"
          test -s "$RUNNER_TEMP/noor-aliman-release.jks"
          chmod 600 "$RUNNER_TEMP/noor-aliman-release.jks"

      - name: Run available unit tests and build signed Release APK
        env:
          NOOR_ALIMAN_KEYSTORE: ${{ runner.temp }}/noor-aliman-release.jks
          NOOR_ALIMAN_STORE_PASSWORD: ${{ secrets.NOOR_ALIMAN_STORE_PASSWORD }}
          NOOR_ALIMAN_KEY_PASSWORD: ${{ secrets.NOOR_ALIMAN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="App/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-aliman-v1.16.1-test-candidate-signed-apk
          path: |
            App/build/outputs/apk/release/app-release.apk
            App/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/noor-aliman-release.jks"
