plugins {
    id 'com.android.application'
}

android {
    namespace 'app.nooraliman'
    compileSdk 36

    testOptions {
        unitTests.includeAndroidResources = true
    }

    defaultConfig {
        applicationId 'app.nooraliman'
        minSdk 23
        targetSdk 36
        versionCode 29
        versionName '1.23.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('NOOR_ALIMAN_KEYSTORE') ?: '../../outputs/noor-aliman-release.jks')
            storePassword System.getenv('NOOR_ALIMAN_STORE_PASSWORD')
            keyAlias 'noor-aliman'
            keyPassword System.getenv('NOOR_ALIMAN_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.work:work-runtime:2.10.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
