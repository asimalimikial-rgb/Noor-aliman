plugins {
    id 'com.android.application'
}

android {
    namespace 'app.nooraliman'
    compileSdk 36

    defaultConfig {
        applicationId 'app.nooraliman'
        minSdk 23
        targetSdk 36
        versionCode 17
        versionName '1.15'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('NOOR_ALIMAN_KEYSTORE') ?: '../../outputs/noor-aliman-release.jks')
            storePassword System.getenv('NOOR_ALIMAN_STORE_PASSWORD')
            keyAlias 'noor-aliman'
            keyPassword System.getenv('NOOR_ALIMAN_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
